<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1024"><title>Arcana — Lobby</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f8f3ff;background:#090d1d}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 28%,#30336d 0,#121833 42%,#090d1d 100%)}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #f6c875;outline-offset:3px}.app{max-width:1180px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));min-height:100dvh;display:flex;flex-direction:column;gap:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.profile,.currency{background:#171c38c9;border:1px solid #51557b;border-radius:16px;padding:11px 14px}.profile small,.muted{color:#b6b9d4}.wallet{display:flex;gap:8px;flex-wrap:wrap;justify-content:end}.currency{font-size:14px}.brand{text-align:center;letter-spacing:.26em;color:#e9c779;font-size:13px;font-weight:800}.stage{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.card{position:relative;width:min(58vw,240px);aspect-ratio: .69;border:6px solid #cfa35e;border-radius:17px;background:radial-gradient(circle at 50% 40%,#7b4bc7,#26204b 65%,#10152e);box-shadow:0 0 0 3px #5c3b84,0 20px 55px #050716,0 0 45px #8060c477;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}.card:before{content:"✦";position:absolute;font-size:240px;color:#ffffff12}.creature{font-size:clamp(75px,17vw,135px);filter:drop-shadow(0 7px 10px #09071b)}.card-label{position:absolute;bottom:0;background:#10162ddd;width:100%;text-align:center;padding:12px 4px;font-weight:800;letter-spacing:.07em}.subtitle{margin:0;color:#e7d5a4;text-align:center}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.actions button,.primary,.back{border:1px solid #5b6189;border-radius:15px;background:linear-gradient(#292f58,#161d3d);padding:15px 8px;font-weight:700;min-height:54px}.actions button:active,.primary:active{transform:scale(.98)}.primary{width:min(100%,420px);background:linear-gradient(130deg,#ffe39c,#b87a26);border-color:#ffdb85;color:#282035;font-size:20px;box-shadow:0 7px 20px #0006}.bottom{display:flex;flex-direction:column;align-items:center;gap:12px}.screen{display:none;position:fixed;inset:0;z-index:4;background:#0b1025f5;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));overflow:auto}.screen.open{display:block}.panel{max-width:800px;margin:auto}.panel h2{color:#f0cd82}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.mini{border:1px solid #65558c;border-radius:14px;background:#242146;padding:18px;text-align:center}.mini strong{display:block;margin:8px}.back{margin-bottom:20px}.tag{font-size:12px;color:#eacb84}@media(min-width:700px){.app{gap:10px}.stage{gap:8px}.card{width:190px}.creature{font-size:105px}.actions{grid-template-columns:repeat(6,minmax(0,1fr))}.bottom{gap:14px}}@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.profile,.currency{padding:8px;font-size:12px}.actions button{font-size:12px;padding:10px 4px}}
</style></head><body><main class="app"><header class="top"><div class="profile">👤 <b>Invocador</b><br><small>Nível 1 · Novato</small></div><div class="wallet"><span class="currency">🪙 500</span><span class="currency">💎 0</span></div></header><div class="brand">✦ ARCANA ✦</div><section class="stage"><div class="card" aria-label="Carta favorita: Dragão Astral"><div class="creature">🐉</div><div class="card-label">DRAGÃO ASTRAL</div></div><p class="subtitle">Sua jornada de invocador começa aqui</p></section><footer class="bottom"><button class="primary" data-page="Jogar">⚔ JOGAR</button><nav class="actions" aria-label="Menu principal"><button data-page="Meu Baralho">🃏<br>Baralho</button><button data-page="Coleção">📚<br>Coleção</button><button data-page="Evoluir">⬆<br>Evoluir</button><button data-page="Fusão">✨<br>Fusão</button><button data-page="Loja">🛍<br>Loja</button><button data-page="Perfil">👤<br>Perfil</button></nav></footer></main><section id="screen" class="screen" role="dialog" aria-modal="true" aria-labelledby="title"><div class="panel"><button class="back" id="back">← Voltar ao lobby</button><h2 id="title"></h2><p id="description" class="muted"></p><div id="content" class="grid"></div></div></section>
<script>
const info={"Jogar":"A arena multiplayer será implementada em uma próxima etapa.","Meu Baralho":"Aqui você montará seu deck e escolherá suas estratégias.","Coleção":"Cartas de todas as raridades ficarão disponíveis nesta área.","Evoluir":"Melhore suas cartas sem eliminar a importância da estratégia.","Fusão":"Combine cartas para desbloquear novas possibilidades.","Loja":"Pacotes e recompensas serão adicionados futuramente.","Perfil":"Seu progresso e suas conquistas aparecerão aqui."};const screen=document.getElementById('screen');function openPage(name){document.getElementById('title').textContent=name;document.getElementById('description').textContent=info[name];const content=document.getElementById('content');content.innerHTML='';if(name==='Coleção'||name==='Meu Baralho'){['Comum','Rara','Épica','Lendária','Mítica'].forEach((rarity,i)=>{const el=document.createElement('div');el.className='mini';el.innerHTML='<span style="font-size:40px">'+['🛡️','🦊','🐺','🐲','🌌'][i]+'</span><strong>Exemplo de carta</strong><span class="tag">'+rarity+'</span>';content.append(el)})}screen.classList.add('open');document.getElementById('back').focus()}function closePage(){screen.classList.remove('open')}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));document.getElementById('back').addEventListener('click',closePage);document.addEventListener('keydown',e=>{if(e.key==='Escape')closePage()});
</script></body></html>
