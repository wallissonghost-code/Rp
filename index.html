<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0d1024"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Arcana"><title>Arcana — Lobby</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f8f3ff;background:#090d1d}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}button{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}img{-webkit-user-drag:none;user-drag:none}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 28%,#30336d 0,#121833 42%,#090d1d 100%)}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #f6c875;outline-offset:3px}.app{max-width:1180px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(22px + env(safe-area-inset-bottom));height:100dvh;max-height:100dvh;overflow:hidden;display:flex;flex-direction:column;gap:clamp(5px,1.5dvh,18px)}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.profile,.currency{background:#171c38c9;border:1px solid #51557b;border-radius:16px;padding:11px 14px}.profile small,.muted{color:#b6b9d4}.wallet{display:flex;gap:8px;flex-wrap:wrap;justify-content:end}.currency{font-size:14px}.brand{text-align:center;letter-spacing:.26em;color:#e9c779;font-size:13px;font-weight:800}.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}.card{position:relative;width:min(50vw,210px,calc(29dvh * .69));aspect-ratio: .69;border:6px solid #cfa35e;border-radius:17px;background:radial-gradient(circle at 50% 40%,#7b4bc7,#26204b 65%,#10152e);box-shadow:0 0 0 3px #5c3b84,0 20px 55px #050716,0 0 45px #8060c477;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}.card:before{content:"✦";position:absolute;font-size:240px;color:#ffffff12}.creature{font-size:clamp(75px,17vw,135px);filter:drop-shadow(0 7px 10px #09071b)}.card-label{position:absolute;bottom:0;background:#10162ddd;width:100%;text-align:center;padding:12px 4px;font-weight:800;letter-spacing:.07em}.subtitle{margin:0;color:#e7d5a4;text-align:center}.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.actions button,.primary,.back{border:1px solid #5b6189;border-radius:15px;background:linear-gradient(#292f58,#161d3d);padding:15px 8px;font-weight:700;min-height:54px}.actions button:active,.primary:active{transform:scale(.98)}.primary{width:min(100%,420px);background:linear-gradient(130deg,#ffe39c,#b87a26);border-color:#ffdb85;color:#282035;font-size:20px;box-shadow:0 7px 20px #0006}.bottom{display:flex;flex-direction:column;align-items:center;gap:10px;flex-shrink:0}.actions{width:min(100%,420px);grid-template-columns:repeat(2,minmax(0,1fr))}.profile{cursor:pointer;text-align:left;color:inherit;font:inherit}.profile:active{transform:scale(.98)}.version{display:inline-block;position:static;margin-left:8px;padding:4px 7px;border:1px solid #8e7bba;border-radius:7px;background:#242146;color:#fff0c7;font-size:12px;font-weight:700;letter-spacing:normal;opacity:1;vertical-align:middle}.screen{display:none;position:fixed;inset:0;z-index:4;background:#0b1025f5;padding:calc(20px + env(safe-area-inset-top)) 18px calc(20px + env(safe-area-inset-bottom));overflow:auto}.screen.open{display:block}.panel{max-width:800px;margin:auto}.panel h2{color:#f0cd82}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.mini{border:1px solid #65558c;border-radius:14px;background:#242146;padding:18px;text-align:center}.mini strong{display:block;margin:8px}.back{margin-bottom:20px}.tag{font-size:12px;color:#eacb84}@media(min-width:700px){.app{gap:10px}.stage{gap:8px}.card{width:190px}.creature{font-size:105px}.actions{grid-template-columns:repeat(2,minmax(0,1fr))}.bottom{gap:14px}}@media(max-width:370px){.app{padding-left:10px;padding-right:10px}.profile,.currency{padding:8px;font-size:12px}.actions button{font-size:12px;padding:10px 4px}}
@media(max-height:650px){.app{gap:4px;padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:calc(6px + env(safe-area-inset-bottom))}.card{width:min(42vw,140px,calc(23dvh * .69))}.creature{font-size:65px}.card-label{font-size:11px;padding:6px}.subtitle{font-size:12px}.primary{min-height:42px;padding:8px}.actions button{min-height:42px;padding:6px}}.screen{overscroll-behavior:contain}</style></head><body><main class="app"><header class="top"><button class="profile" data-page="Perfil">👤 <b>Invocador</b><br><small>Nível 1 · Novato</small></button><div class="wallet"><span class="currency">🪙 500</span><span class="currency">💎 0</span></div></header><div class="brand">✦ ARCANA ✦ <span class="version" id="game-version">v0.1.6</span></div><section class="stage"><div class="card" aria-label="Carta favorita: Dragão Astral"><div class="creature">🐉</div><div class="card-label">DRAGÃO ASTRAL</div></div><p class="subtitle">Sua jornada de invocador começa aqui</p></section><footer class="bottom"><button class="primary" data-page="Jogar">⚔ JOGAR</button><nav class="actions" aria-label="Menu principal"><button data-page="Loja">🛍 Loja</button><button data-page="Coleção">🃏 Coleção</button></nav></footer></main><section id="screen" class="screen" role="dialog" aria-modal="true" aria-labelledby="title"><div class="panel"><button class="back" id="back">← Voltar ao lobby</button><h2 id="title"></h2><p id="description" class="muted"></p><div id="content" class="grid"></div></div></section>
<script>
const info={"Jogar":"A arena multiplayer será implementada em uma próxima etapa.","Baralho":"Aqui você montará seu deck e escolherá suas estratégias.","Coleção":"Cartas de todas as raridades ficarão disponíveis nesta área.","Evoluir":"Melhore suas cartas sem eliminar a importância da estratégia.","Fusão":"Combine cartas para desbloquear novas possibilidades.","Loja":"Pacotes e recompensas serão adicionados futuramente.","Perfil":"Seu progresso e suas conquistas aparecerão aqui."};const screen=document.getElementById('screen');function openPage(name){document.getElementById('title').textContent=name;document.getElementById('description').textContent=info[name];const content=document.getElementById('content');content.innerHTML='';if(name==='Coleção'){const tools=document.createElement("div");tools.style.cssText="grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap";tools.innerHTML='<button class="back" data-sub="Baralho">🃏 Montar baralho</button><button class="back" data-sub="Evoluir">⬆ Evoluir</button><button class="back" data-sub="Fusão">✨ Fusão</button>';content.append(tools);tools.querySelectorAll("[data-sub]").forEach(b=>b.addEventListener("click",()=>openPage(b.dataset.sub)));['Comum','Rara','Épica','Lendária','Mítica'].forEach((rarity,i)=>{const el=document.createElement('div');el.className='mini';el.innerHTML='<span style="font-size:40px">'+['🛡️','🦊','🐺','🐲','🌌'][i]+'</span><strong>Exemplo de carta</strong><span class="tag">'+rarity+'</span>';content.append(el)})}screen.classList.add('open');document.getElementById('back').focus()}function closePage(){screen.classList.remove('open')}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>openPage(b.dataset.page)));document.getElementById('back').addEventListener('click',closePage);document.addEventListener('keydown',e=>{if(e.key==='Escape')closePage()});document.addEventListener("contextmenu",e=>e.preventDefault());document.addEventListener("dragstart",e=>e.preventDefault());
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn))}</script></body></html>
